# install → 레지스트리 검사 → commitlint(PR 커밋) → lint → typecheck → test → build → 번들 비밀 검사 (ADR 0005)
# Supabase secrets 는 이 워크플로에 주지 않는다: 빌드는 인메모리 저장소로 하고, 클라우드 DB 는 contract.yml 만 쓴다
# Playwright 시각 비교는 시안 PNG 가 레포에 없어서 로컬에서만 돌린다 (ADR 0004)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 체크아웃과 읽기만 한다. 기본 토큰 권한을 최소로 줄인다
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # PR 의 커밋 범위를 commitlint 하려면 base 까지 히스토리가 필요하다
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # 버전은 package.json packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 레지스트리 허용 목록 검사
        run: pnpm check:registry

      - name: commitlint (PR 커밋)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - name: 클라이언트 번들 비밀 검사
        run: pnpm check:bundle
